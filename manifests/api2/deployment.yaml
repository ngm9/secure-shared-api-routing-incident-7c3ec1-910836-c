apiVersion: apps/v1
kind: Deployment
metadata:
  name: api2
  namespace: api2
  labels:
    app: api2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api2
  template:
    metadata:
      labels:
        app: api2
    spec:
      containers:
        - name: api2
          image: api2-local:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: API_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: api2-runtime
                  key: API_MESSAGE
          resources:
            requests:
              cpu: "500m"
              memory: "384Mi"
            limits:
              cpu: "700m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
